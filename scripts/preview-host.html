<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>pretty-md · Local MCP App test host</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;display:block}body{background:#faf9f6}</style></head>
<body>
  <iframe id="reader" title="pretty-md reader" allow="clipboard-write" sandbox="allow-scripts allow-downloads allow-modals allow-forms"></iframe>
  <script>
    // A development host exercises the real MCP resource and tool results.
    // It is never bundled into the published Worker or MCP reader resource.
    const reader = document.getElementById('reader');
    let requestId = 0;
    let launchResult;
    let initialize;
    const initialized = new Promise((resolve) => { initialize = resolve; });
    async function rpc(method, params) {
      const response = await fetch('/mcp', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ jsonrpc: '2.0', id: ++requestId, method, params }) });
      const message = await response.json();
      if (!response.ok || message.error) throw new Error(message.error?.message || 'MCP request failed');
      return message.result;
    }
    function send(message) { reader.contentWindow.postMessage({ jsonrpc: '2.0', ...message }, '*'); }
    window.addEventListener('message', async ({ source, data }) => {
      if (source !== reader.contentWindow || data?.jsonrpc !== '2.0') return;
      if (data.method === 'ui/initialize') {
        send({ id: data.id, result: { protocolVersion: '2026-01-26', hostInfo: { name: 'pretty-md-local-host', version: '1.0.0' }, hostCapabilities: { serverResources: {}, serverTools: {} }, hostContext: { theme: 'light', displayMode: 'fullscreen', availableDisplayModes: ['fullscreen'] } } });
      } else if (data.method === 'ui/notifications/initialized') {
        send({ method: 'ui/notifications/tool-result', params: launchResult });
        initialize();
      } else if (data.method === 'ui/request-display-mode') {
        send({ id: data.id, result: { mode: 'fullscreen' } });
      } else if (['tools/call', 'resources/read'].includes(data.method)) {
        try { send({ id: data.id, result: await rpc(data.method, data.params) }); }
        catch (error) { send({ id: data.id, error: { code: -32000, message: error.message } }); }
      }
    });
    window.prettyMdPreview = {
      ready: initialized,
      async render(markdown, filename = 'Untitled.md') {
        await initialized;
        const result = await rpc('tools/call', { name: 'pretty_md_render', arguments: { markdown, filename } });
        send({ method: 'ui/notifications/tool-result', params: result });
        return result;
      },
    };
    (async () => {
      launchResult = await rpc('tools/call', { name: 'pretty_md_open', arguments: {} });
      const resource = await rpc('resources/read', { uri: 'ui://pretty-md/reader-v2' });
      reader.srcdoc = resource.contents[0].text;
    })().catch((error) => { document.body.textContent = error.message; });
  </script>
</body>
</html>
